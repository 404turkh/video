services:
  - type: web
    name: substudio-whisper
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://404turkh.github.io
      - key: STUDIO_ACCESS_KEY
        generateValue: true
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE
        value: int8
      - key: MAX_VIDEO_SECONDS
        value: "600"
      - key: MAX_UPLOAD_MB
        value: "120"
