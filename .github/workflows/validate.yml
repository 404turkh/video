name: Verify SubStudio sources
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check self-hosted transcription Python syntax
        run: python -m py_compile backend/transcription_server.py
      - name: Check browser JavaScript syntax
        run: |
          node --check studio-v06.js
          node --check studio-v06-export.js
          node --check studio-v06-storage.js
          node --check subtitle-timing.js
          node --check local-transcriber.js
